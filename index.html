<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartNote AI</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 18px;background:#101827;color:#f4f6fb}h1{color:#a7d8ff}textarea,input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #536078;font:inherit}textarea,input{background:#1b2739;color:white}button{background:#6ab8ff;color:#071526;border:0;font-weight:700;cursor:pointer}.note{background:#1b2739;padding:14px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}.note button{width:auto;background:#f5a9a9;margin-right:8px}small{color:#b9c6d7}.muted{color:#aab7c9}</style></head><body><h1>🧠 SmartNote AI</h1><p class="muted">Dein kostenloser Notiz-Assistent – ohne Anmeldung und ohne Server.</p><label for="title">Titel</label><input id="title" placeholder="Titel deiner Notiz" maxlength="120"><label for="content">Notiz</label><textarea id="content" rows="5" placeholder="Schreib hier deine Gedanken ..."></textarea><button id="save">Notiz speichern</button><label for="search">Notizen durchsuchen</label><input id="search" placeholder="Suchbegriff eingeben"><div id="notes"></div><script>
const key='smartnote-ai-notes';let notes=[];try{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))notes=stored}catch{};
const $=id=>document.getElementById(id);
function category(text){const t=text.toLowerCase();if(/arbeit|meeting|kunde|projekt|termin/.test(t))return '💼 Arbeit';if(/einkauf|essen|rezept|kochen/.test(t))return '🍽️ Alltag';if(/idee|erfindung|konzept|plan/.test(t))return '💡 Ideen';return '🗂️ Allgemein'}
function persist(){try{localStorage.setItem(key,JSON.stringify(notes))}catch{alert('Speichern fehlgeschlagen. Bitte Browser-Speicher prüfen.')}}
function render(){const box=$('notes');box.replaceChildren();const q=$('search').value.toLowerCase();const filtered=notes.filter(n=>(n.title+' '+n.content).toLowerCase().includes(q));if(!filtered.length){const p=document.createElement('p');p.className='muted';p.textContent='Keine Notizen gefunden.';box.append(p)}for(const n of filtered){const div=document.createElement('article');div.className='note';const h=document.createElement('h3');h.textContent=n.title;const tag=document.createElement('small');tag.textContent=category(n.title+' '+n.content);const p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.textContent=n.content;const del=document.createElement('button');del.textContent='Löschen';del.onclick=()=>{if(confirm('Notiz löschen?')){notes=notes.filter(x=>x.id!==n.id);persist();render()}};const edit=document.createElement('button');edit.textContent='Bearbeiten';edit.onclick=()=>{$('title').value=n.title;$('content').value=n.content;notes=notes.filter(x=>x.id!==n.id);persist();render();window.scrollTo(0,0)};div.append(h,tag,p,edit,del);box.append(div)}}
$('save').onclick=()=>{const title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content){alert('Bitte Titel und Notiz eingeben.');return}notes.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),title,content});persist();$('title').value='';$('content').value='';render()};$('search').oninput=render;render();
</script></body></html>
